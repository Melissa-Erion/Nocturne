# Builds the Regimen web app and publishes it to GitHub Pages:
#   https://melissa-erion.github.io/Nocturne/
name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['regimen/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regimen
    env:
      EXPO_BASE_URL: /Nocturne
      EXPO_PUBLIC_BASE_URL: /Nocturne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: regimen/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npx expo export --platform web --output-dir dist
      # Single-page app: GitHub Pages serves 404.html for deep links like /Nocturne/schedule.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: regimen/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
