<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Regimen — Fitness, Nutrition &amp; Progress</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Regimen">
<meta name="theme-color" content="#161826">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#161826"></rect><rect x="30" y="30" width="40" height="40" rx="9" fill="#9184d9"></rect></svg></template>
<link rel="stylesheet" href="_ds/nocturne-124ecda7-7b17-42bd-b77f-decc2e83e187/styles.css">
<script src="_ds/nocturne-124ecda7-7b17-42bd-b77f-decc2e83e187/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="store.js"></script>
<style>
body{margin:0;background:var(--color-bg)}
a{color:var(--color-accent-300)}a:hover{color:var(--color-accent-200)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
select.input{appearance:none}
@keyframes rgFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="display:flex;min-height:100vh;background:var(--color-bg);color:var(--color-text)">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<aside style="position:sticky;top:0;height:100vh;overflow-y:auto;flex:none;width:236px;display:flex;flex-direction:column;gap:18px;padding:20px 14px 24px;background:linear-gradient(180deg,#1b1d2c,var(--color-bg))">
<div style="display:flex;align-items:center;gap:8px;padding:0 8px"><span style="width:10px;height:10px;border-radius:3px;background:var(--color-accent);box-shadow:0 0 12px var(--color-accent)"></span><span style="font-size:17px;font-weight:500;letter-spacing:-0.01em">Regimen</span></div>
<sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:1px">
<div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding:0 8px 6px">{{ g.label }}</div>
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
<button onClick="{{ it.go }}" style="{{ it.style }}"><i class="{{ it.icon }}" style="font-size:16px"></i><span style="flex:1;text-align:left">{{ it.label }}</span><span style="font-size:10px;color:var(--color-accent)">{{ it.badge }}</span></button>
</sc-for>
</div>
</sc-for>
<div style="margin-top:auto;padding:10px 8px 0;font-size:11px;line-height:1.45;color:var(--color-neutral-600)"><i class="ph ph-lock-simple"></i> Check-ins, measurements and photos are private and stay on this device.</div>
</aside>
</sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
<header style="position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb, var(--color-bg) 92%, transparent);backdrop-filter:blur(8px)">
<button class="btn btn-icon btn-ghost" onClick="{{ openMenu }}" aria-label="Menu"><i class="ph ph-list" style="font-size:22px;color:var(--color-text)"></i></button>
<span style="width:9px;height:9px;border-radius:3px;background:var(--color-accent);box-shadow:0 0 10px var(--color-accent)"></span>
<span style="font-size:16px;font-weight:500">{{ pageTitle }}</span>
</header>
</sc-if>
<sc-if value="{{ showActiveBar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ goWorkout }}" style="display:flex;align-items:center;gap:10px;margin:12px 20px 0;padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--color-accent-700);background:var(--color-accent-900);color:var(--color-accent-100);font:inherit;font-size:13px;cursor:pointer;text-align:left"><i class="ph-fill ph-record" style="color:var(--color-accent);font-size:14px"></i><span style="flex:1">{{ activeLabel }} in progress · tap to resume</span><i class="ph ph-arrow-right"></i></button>
</sc-if>
<main style="{{ mainStyle }}">
<sc-if value="{{ r.dashboard }}" hint-placeholder-val="{{ true }}"><dc-import name="FitDashboard" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ r.schedule }}" hint-placeholder-val="{{ false }}"><dc-import name="FitSchedule" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.plans }}" hint-placeholder-val="{{ false }}"><dc-import name="FitPlans" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.workout }}" hint-placeholder-val="{{ false }}"><dc-import name="FitWorkout" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ r.history }}" hint-placeholder-val="{{ false }}"><dc-import name="FitHistory" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.records }}" hint-placeholder-val="{{ false }}"><dc-import name="FitRecords" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.checkins }}" hint-placeholder-val="{{ false }}"><dc-import name="FitCheckins" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.photos }}" hint-placeholder-val="{{ false }}"><dc-import name="FitPhotos" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.analytics }}" hint-placeholder-val="{{ false }}"><dc-import name="FitAnalytics" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.nutrition }}" hint-placeholder-val="{{ false }}"><dc-import name="FitNutrition" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.meals }}" hint-placeholder-val="{{ false }}"><dc-import name="FitMeals" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.prep }}" hint-placeholder-val="{{ false }}"><dc-import name="FitPrep" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.recipes }}" hint-placeholder-val="{{ false }}"><dc-import name="FitRecipes" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.alternatives }}" hint-placeholder-val="{{ false }}"><dc-import name="FitAlternatives" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.grocery }}" hint-placeholder-val="{{ false }}"><dc-import name="FitGrocery" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.settings }}" hint-placeholder-val="{{ false }}"><dc-import name="FitSettings" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{ r.onboarding }}" hint-placeholder-val="{{ false }}"><dc-import name="FitOnboarding" hint-size="100%,800px"></dc-import></sc-if>
</main>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:40;background:color-mix(in srgb, var(--color-neutral-900) 60%, transparent)"></div>
<aside style="position:fixed;z-index:41;top:0;left:0;bottom:0;width:min(290px,86vw);overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:18px 14px;background:var(--color-bg);box-shadow:var(--shadow-lg)">
<div style="display:flex;align-items:center;gap:8px;padding:0 8px"><span style="width:10px;height:10px;border-radius:3px;background:var(--color-accent)"></span><span style="font-size:17px;font-weight:500;margin-right:auto">Regimen</span><button class="btn btn-icon btn-ghost" onClick="{{ closeMenu }}"><i class="ph ph-x" style="font-size:18px;color:var(--color-text)"></i></button></div>
<sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:1px">
<div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding:0 8px 6px">{{ g.label }}</div>
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
<button onClick="{{ it.goClose }}" style="{{ it.styleLg }}"><i class="{{ it.icon }}" style="font-size:18px"></i><span style="flex:1;text-align:left">{{ it.label }}</span></button>
</sc-for>
</div>
</sc-for>
</aside>
</sc-if>
<sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;z-index:60;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,92vw);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-lg);font-size:13px;animation:rgFade .2s ease"><i class="ph ph-check-circle" style="color:var(--color-accent);font-size:16px"></i><span>{{ toast }}</span></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    const h = () => { if (!window.RG) return this.t = setTimeout(h, 30); this.u = window.RG.subscribe(() => this.forceUpdate()); if (!window.RG.s.profile.onboarded) window.RG.go('onboarding'); this.forceUpdate(); };
    h();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); this.u && this.u(); clearTimeout(this.t); }
  renderVals() {
    const RG = window.RG; const wide = this.state.w >= 980;
    const route = RG ? RG.s.route : 'dashboard';
    const pages = [
      ['Training', [['dashboard', 'Fitness Dashboard', 'ph-house'], ['schedule', 'My Schedule', 'ph-calendar-blank'], ['plans', 'Workout Plans', 'ph-list-checks'], ['workout', 'Active Workout', 'ph-barbell'], ['history', 'Exercise History', 'ph-clock-counter-clockwise'], ['records', 'Personal Records', 'ph-trophy']]],
      ['Progress', [['checkins', 'Progress Check-Ins', 'ph-clipboard-text'], ['photos', 'Progress Photos', 'ph-camera'], ['analytics', 'Analytics', 'ph-chart-line-up']]],
      ['Nutrition', [['nutrition', 'Nutrition Dashboard', 'ph-chart-donut'], ['meals', 'Meal Planner', 'ph-fork-knife'], ['prep', 'Meal-Prep Calculator', 'ph-cooking-pot'], ['recipes', 'Recipes & Saved Meals', 'ph-book-open'], ['alternatives', 'Food Alternatives', 'ph-swap'], ['grocery', 'Grocery List', 'ph-shopping-cart']]],
      ['Account', [['settings', 'Fitness Settings', 'ph-gear']]]
    ];
    const active = RG && RG.s.active;
    const st = (on, lg) => ({ display: 'flex', alignItems: 'center', gap: '10px', width: '100%', padding: lg ? '10px 8px' : '6px 8px', border: 0, borderRadius: '6px', font: 'inherit', fontSize: lg ? '15px' : '13px', cursor: 'pointer', textAlign: 'left',
      color: on ? 'var(--color-text)' : 'var(--color-neutral-400)', background: on ? 'color-mix(in srgb, var(--color-accent) 12%, transparent)' : 'transparent', boxShadow: on ? 'inset 2px 0 0 var(--color-accent)' : 'none' });
    const navGroups = pages.map(([label, items]) => ({ label, items: items.map(([id, l, ic]) => ({ label: l, icon: 'ph ' + ic, badge: id === 'workout' && active ? '● live' : '', style: st(route === id), styleLg: st(route === id, true),
      go: () => RG && RG.go(id), goClose: () => { this.setState({ menu: false }); RG && RG.go(id); } })) }));
    const r = {}; pages.forEach(g => g[1].forEach(p => r[p[0]] = route === p[0])); r.onboarding = route === 'onboarding';
    const title = (pages.flatMap(g => g[1]).find(p => p[0] === route) || [0, 'Setup'])[1];
    const wk = active && RG.workout(active.workoutId, active.planId);
    return {
      wide, narrow: !wide, navGroups, r, pageTitle: title, menuOpen: this.state.menu && !wide,
      openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),
      showActiveBar: !!active && route !== 'workout', activeLabel: wk ? wk.name : 'Workout', goWorkout: () => RG.go('workout'),
      mainStyle: { width: '100%', maxWidth: '1320px', boxSizing: 'border-box', padding: wide ? '22px 28px 48px' : '12px 14px 40px' },
      hasToast: !!(RG && RG.s.toast), toast: RG && RG.s.toast ? RG.s.toast.msg : ''
    };
  }
}
</script>
</body>
</html>
